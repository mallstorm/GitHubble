apply plugin: 'com.android.application'

def configuredGithubClientId = (project.findProperty('GITHUB_CLIENT_ID') ?: System.getenv('GITHUB_CLIENT_ID') ?: '').toString().trim()
def githubClientId = configuredGithubClientId.isEmpty() ? 'Iv23ligNq2gfjSk90Tn7' : configuredGithubClientId
def escapedGithubClientId = githubClientId.replace('\\', '\\\\').replace('\"', '\\"')
def configuredGithubAppSlug = (project.findProperty('GITHUB_APP_SLUG') ?: System.getenv('GITHUB_APP_SLUG') ?: '').toString().trim()
def githubAppSlug = configuredGithubAppSlug.isEmpty() ? 'gihubble' : configuredGithubAppSlug
def escapedGithubAppSlug = githubAppSlug.replace('\\', '\\\\').replace('\"', '\\\"')
// Distributed GitHubble APKs contain ONLY arm64-v8a native binaries.
// CI may compile a temporary x86_64 debug build solely to run the Android 13 emulator;
// it is never published. Release and the final PR APK are always ARM64.
def ciEmulatorAbi = (project.findProperty('GITHUBBLE_CI_EMULATOR_ABI') ?: '').toString().trim()
if (!ciEmulatorAbi.isEmpty() && ciEmulatorAbi != 'x86_64') {
    throw new GradleException('Unsupported CI emulator ABI override')
}
// CI-only smoke target: production shrink rules, temporary x86_64 ABI and debug certificate.
// This APK is never a distribution artifact and never uses the production keystore.
def r8Smoke = (project.findProperty('GITHUBBLE_R8_SMOKE') ?: 'false').toString() == 'true'
if (r8Smoke && ciEmulatorAbi != 'x86_64') {
    throw new GradleException('R8 smoke signing is restricted to the x86_64 emulator')
}
def releaseVersion = new Properties()
file('../version.properties').withInputStream { releaseVersion.load(it) }
def appVersionName = releaseVersion.getProperty('VERSION_NAME')
def appVersionCode = releaseVersion.getProperty('VERSION_CODE').toInteger()
def releaseChannel = releaseVersion.getProperty('RELEASE_CHANNEL')

android {
    buildFeatures { buildConfig true }
    namespace 'app.githubble.mobile'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'app.githubble.mobile'
        minSdk 28
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'GITHUB_CLIENT_ID', '"' + escapedGithubClientId + '"'
        buildConfigField 'String', 'GITHUB_APP_SLUG', '"' + escapedGithubAppSlug + '"'
        buildConfigField 'boolean', 'FEATURE_FREEZE', 'false'
        buildConfigField 'String', 'RC_CHANNEL', '"' + releaseChannel + '"'
        testInstrumentationRunner (r8Smoke ? 'app.githubble.mobile.R8SmokeInstrumentation' : 'app.githubble.mobile.RcInstrumentationTest')
        ndk {
            abiFilters(ciEmulatorAbi.isEmpty() ? 'arm64-v8a' : ciEmulatorAbi)
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (r8Smoke) signingConfig signingConfigs.debug
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }



    testBuildType (r8Smoke ? 'release' : 'debug')
    if (r8Smoke) {
        sourceSets.androidTest.java.setSrcDirs(['src/r8Smoke/java'])
    }

    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'io.github.toolshubofficial:libxray:26.6.27'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

