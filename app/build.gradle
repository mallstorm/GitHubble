apply plugin: 'com.android.application'

def githubClientId = (project.findProperty('GITHUB_CLIENT_ID') ?: System.getenv('GITHUB_CLIENT_ID') ?: '').toString()
def escapedGithubClientId = githubClientId.replace('\\', '\\\\').replace('\"', '\\"')

android {
    buildFeatures { buildConfig true }
    namespace 'app.githubble.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.githubble.mobile'
        minSdk 28
        targetSdk 36
        versionCode 37
        versionName '1.0.0-rc3.3-account-center'
        buildConfigField 'String', 'GITHUB_CLIENT_ID', '"' + escapedGithubClientId + '"'
        buildConfigField 'String', 'GITHUB_OAUTH_SCOPES', '""'
        buildConfigField 'boolean', 'FEATURE_FREEZE', 'false'
        buildConfigField 'String', 'RC_CHANNEL', '"rc3.3"'
        testInstrumentationRunner 'app.githubble.mobile.RcInstrumentationTest'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }



    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
