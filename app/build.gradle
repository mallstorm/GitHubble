apply plugin: 'com.android.application'

def configuredGithubClientId = (project.findProperty('GITHUB_CLIENT_ID') ?: System.getenv('GITHUB_CLIENT_ID') ?: '').toString().trim()
def githubClientId = configuredGithubClientId.isEmpty() ? 'Iv23ligNq2gfjSk90Tn7' : configuredGithubClientId
def escapedGithubClientId = githubClientId.replace('\\', '\\\\').replace('\"', '\\"')
def configuredGithubAppSlug = (project.findProperty('GITHUB_APP_SLUG') ?: System.getenv('GITHUB_APP_SLUG') ?: '').toString().trim()
def githubAppSlug = configuredGithubAppSlug.isEmpty() ? 'gihubble' : configuredGithubAppSlug
def escapedGithubAppSlug = githubAppSlug.replace('\\', '\\\\').replace('\"', '\\\"')
def releaseVersion = new Properties()
file('../version.properties').withInputStream { releaseVersion.load(it) }
def appVersionName = releaseVersion.getProperty('VERSION_NAME')
def appVersionCode = releaseVersion.getProperty('VERSION_CODE').toInteger()
def releaseChannel = releaseVersion.getProperty('RELEASE_CHANNEL')

android {
    buildFeatures { buildConfig true }
    namespace 'app.githubble.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'app.githubble.mobile'
        minSdk 28
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField 'String', 'GITHUB_CLIENT_ID', '"' + escapedGithubClientId + '"'
        buildConfigField 'String', 'GITHUB_APP_SLUG', '"' + escapedGithubAppSlug + '"'
        buildConfigField 'boolean', 'FEATURE_FREEZE', 'false'
        buildConfigField 'String', 'RC_CHANNEL', '"' + releaseChannel + '"'
        testInstrumentationRunner 'app.githubble.mobile.RcInstrumentationTest'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }



    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
