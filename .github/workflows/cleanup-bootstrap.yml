name: Cleanup temporary bootstrap data

on:
  push:
    paths:
      - '.cleanup/READY'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .cleanup
          rm -f .github/workflows/connector-check.yml
          rm -f .github/workflows/bootstrap-safe.yml
          rm -f .github/workflows/cleanup-bootstrap.yml
          git config user.name 'mallstorm'
          git config user.email '142712475+mallstorm@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean temporary source bootstrap data'
            git push origin HEAD:main
          fi
