name: Redesign UI review
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'UI checks to run'
        type: choice
        options: [redesign, agent-model-picker]
        default: redesign
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/redesign-ui.yml'
permissions:
  contents: write
concurrency:
  group: redesign-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screens:
    if: startsWith(github.head_ref, 'claude/redesign') || github.head_ref == 'claude/display-scale' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_SUITE: ${{ inputs.suite || 'redesign' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build debug and instrumentation
        run: |
          if [ "$UI_SUITE" = 'agent-model-picker' ]; then
            flag=-PGITHUBBLE_AGENT_UI=true
          else
            flag=-PGITHUBBLE_REDESIGN_UI=true
          fi
          ./gradlew --no-daemon --max-workers=2 -PGITHUBBLE_CI_EMULATOR_ABI=x86_64 "$flag" assembleDebug assembleDebugAndroidTest
      - name: Prepare emulator
        run: |
          sudo rm -rf /usr/share/dotnet
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-redesign-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render real screens and audit layout
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: bash tools/run-ui-review.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-ui
          path: redesign-ui/
      - name: Publish renders to the preview branch
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          test -d redesign-ui || exit 0
          cp -r redesign-ui /tmp/redesign-ui
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan preview-redesign-ui
          git rm -rfq . || true
          mkdir -p docs/previews/redesign-ui
          cp /tmp/redesign-ui/* docs/previews/redesign-ui/
          git add docs/previews/redesign-ui
          git commit -qm "docs: redesign UI renders"
          git push -f origin HEAD:refs/heads/preview/redesign-ui
