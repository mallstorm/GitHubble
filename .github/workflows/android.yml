name: Android RC CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.1'}
      - name: Build RC artifacts
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
        run: gradle --no-daemon test assembleRelease assembleDebugAndroidTest bundleRelease
      - name: Generate SBOM
        run: python3 tools/generate-sbom.py . release/GitHubble_1.0.0-rc3.3_SPDX.json
      - uses: actions/upload-artifact@v4
        with:
          name: githubble-rc-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/apk/androidTest/debug/*.apk
            release/*SPDX.json
