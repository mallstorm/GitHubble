name: GitHubble Android checks and release

# STABLE RELEASE POLICY:
# Fast path (RC3.9-style): unit tests plus Debug/Release compile, without an emulator.
# PRs may publish a short-lived TEST artifact. Main publishes directly to GitHub Releases,
# so a temporarily exhausted Actions artifact-storage quota cannot block production builds.
# Use workflow_dispatch with full_validation=true for lint + emulator regressions.
# PR builds never use release-signing secrets; release signing is main-only.
# Working/backup branches do not publish builds.
on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: 'Run lint and Android emulator regressions (slower, manual only)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: githubble-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      version_name: ${{ steps.version.outputs.name }}
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.GITHUBBLE_RELEASE_KEYSTORE_BASE64 != '' && secrets.GITHUBBLE_RELEASE_STORE_PASSWORD != '' && secrets.GITHUBBLE_RELEASE_KEY_PASSWORD != '' && secrets.GITHUBBLE_RELEASE_KEY_ALIAS != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Enable KVM for Android emulator
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Read release manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source version.properties
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Fast unit tests and Debug/Release compile
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
        run: gradle --no-daemon test assembleDebug assembleRelease

      - name: Extended lint and instrumentation APK (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon lintRelease assembleDebugAndroidTest
          result=$?
          if [ "$result" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
            [ ! -f "$report" ] || cat "$report"
          fi
          exit "$result"

      - name: On-device regression suite (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.full_validation == true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm list instrumentation
            adb shell am instrument -w app.githubble.mobile.debug.test/app.githubble.mobile.RcInstrumentationTest

      - name: Git Agent Android 13 UI and state regression
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/omnichat-native-agent-phase1'
        run: gradle --no-daemon assembleDebugAndroidTest

      - name: Enable KVM for Git Agent Android 13 checks
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/omnichat-native-agent-phase1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-git-agent-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Git Agent light and dark screenshots on Android 13
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/omnichat-native-agent-phase1'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          disk-size: 2048M
          emulator-boot-timeout: 180
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 180s adb shell am instrument -w app.githubble.mobile.debug.test/app.githubble.mobile.RcInstrumentationTest > instrumentation-result.txt
            cat instrumentation-result.txt
            grep -q 'PASS: RC instrumentation suite' instrumentation-result.txt
            mkdir -p dist-pr/screenshots
            adb pull /sdcard/Android/data/app.githubble.mobile.debug/files/ui-screenshots/. dist-pr/screenshots/

      - name: Export PR test APK and exact tested source tree
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-pr
          cp app/build/outputs/apk/debug/app-debug.apk "dist-pr/GitHubble-${{ steps.version.outputs.name }}-pr${{ github.event.pull_request.number }}-debug.apk"
          git archive --format=zip --output="dist-pr/GitHubble-${{ steps.version.outputs.name }}-pr${{ github.event.pull_request.number }}-sources.zip" HEAD
          test -s "dist-pr/GitHubble-${{ steps.version.outputs.name }}-pr${{ github.event.pull_request.number }}-sources.zip"
          sha256sum dist-pr/*.apk > dist-pr/SHA256SUMS.txt
          sha256sum dist-pr/*.zip > dist-pr/SOURCE_SHA256.txt
          printf '%s\n' "$(git rev-parse HEAD)" > dist-pr/SOURCE_COMMIT.txt
          printf '%s\n' "TEST DEBUG APK ONLY: PR validation, not a signed production Release." > dist-pr/SIGNING_INFO.txt

      - name: Publish PR test APK and sources
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: githubble-pr${{ github.event.pull_request.number }}-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist-pr/*
          if-no-files-found: error
          retention-days: 1

      - name: Sign release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.GITHUBBLE_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GITHUBBLE_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GITHUBBLE_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GITHUBBLE_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/githubble-release.p12"
          echo "Signing mode: persistent repository release keystore" > dist/SIGNING_INFO.txt
          SDK_BIN="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "${UNSIGNED}"
          "${SDK_BIN}/zipalign" -f -p 4 "${UNSIGNED}" "${RUNNER_TEMP}/githubble-aligned.apk"
          "${SDK_BIN}/apksigner" sign \
            --ks "${RUNNER_TEMP}/githubble-release.p12" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "dist/GitHubble-${{ steps.version.outputs.name }}-release.apk" \
            "${RUNNER_TEMP}/githubble-aligned.apk"
          "${SDK_BIN}/apksigner" verify --verbose --print-certs "dist/GitHubble-${{ steps.version.outputs.name }}-release.apk" > dist/APK_VERIFICATION.txt
          "${SDK_BIN}/aapt" dump badging "dist/GitHubble-${{ steps.version.outputs.name }}-release.apk" | grep '^package:' > dist/PACKAGE_INFO.txt
          grep -q "name='app.githubble.mobile'" dist/PACKAGE_INFO.txt
          grep -q "versionCode='${{ steps.version.outputs.code }}'" dist/PACKAGE_INFO.txt
          rm -f "${RUNNER_TEMP}/githubble-release.p12" "${RUNNER_TEMP}/githubble-aligned.apk"

      - name: Record unavailable release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING != 'true'
        shell: bash
        run: |
          mkdir -p dist
          echo "Signed release not produced: configure the persistent GitHub release-signing secrets." > dist/SIGNING_INFO.txt

      - name: Export APKs and exact main source tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GitHubble-${{ steps.version.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/GitHubble-${{ steps.version.outputs.name }}-release-unsigned.apk"
          git archive --format=zip --output="dist/GitHubble-${{ steps.version.outputs.name }}-main-sources.zip" HEAD
          test -s "dist/GitHubble-${{ steps.version.outputs.name }}-main-sources.zip"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          sha256sum "dist/GitHubble-${{ steps.version.outputs.name }}-main-sources.zip" > dist/SOURCE_SHA256.txt
          printf '%s\n' "$(git rev-parse HEAD)" > dist/SOURCE_COMMIT.txt

      - name: Verify and publish main bundle directly to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid VERSION_NAME"; exit 1; }
          test "$(cat dist/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          test -s "dist/GitHubble-${VERSION_NAME}-debug.apk"
          test -s "dist/GitHubble-${VERSION_NAME}-main-sources.zip"
          sha256sum -c dist/SHA256SUMS.txt
          sha256sum -c dist/SOURCE_SHA256.txt

          tag="build-${VERSION_NAME}-${GITHUB_SHA:0:12}"
          files=(
            "dist/GitHubble-${VERSION_NAME}-debug.apk"
            "dist/GitHubble-${VERSION_NAME}-main-sources.zip"
            dist/SHA256SUMS.txt
            dist/SOURCE_SHA256.txt
            dist/SOURCE_COMMIT.txt
            dist/SIGNING_INFO.txt
          )
          signing_note="No production-signed Release APK was produced. Use the Debug APK for testing only."
          if [[ -s "dist/GitHubble-${VERSION_NAME}-release.apk" ]]; then
            files+=("dist/GitHubble-${VERSION_NAME}-release.apk" dist/APK_VERIFICATION.txt dist/PACKAGE_INFO.txt)
            signing_note="A release-signed APK is included. Verify its certificate before updating an existing installation."
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated prerelease from the tested main commit ${GITHUB_SHA}.

          - Version: ${VERSION_NAME}
          - Debug APK: test build, not a production release. Its signing key may differ between CI runs; installation over an older APK is not guaranteed.
          - ${signing_note}
          - Unsigned Release APK is intentionally excluded because it cannot be installed as-is.
          - Source ZIP and SHA-256 checksums correspond to this exact main commit.
          - Main releases are uploaded directly to GitHub Releases and do not consume Actions artifact storage.
          - The repository is private: downloading these assets requires authorized GitHub access.
          EOF

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists; refreshing its assets for this exact commit."
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "GitHubble ${VERSION_NAME} (build ${GITHUB_SHA:0:12})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi

