name: GitHubble Android Release

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Test and compile release (not debug)
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
        run: gradle --no-daemon test assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.GITHUBBLE_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GITHUBBLE_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GITHUBBLE_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GITHUBBLE_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "${KEYSTORE_B64}" ]; then
            test -n "${STORE_PASSWORD}" && test -n "${KEY_PASSWORD}" && test -n "${KEY_ALIAS}"
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/githubble-release.p12"
            echo "Signing mode: repository-provided release keystore" > dist/SIGNING_INFO.txt
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="${STORE_PASSWORD}"
            KEY_ALIAS="githubble-release"
            keytool -genkeypair -noprompt \
              -keystore "${RUNNER_TEMP}/githubble-release.p12" -storetype PKCS12 \
              -storepass "${STORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=GitHubble Temporary Release, O=GitHubble"
            echo "Signing mode: TEMPORARY generated certificate. This APK cannot update a different signed installation; save a permanent keystore in GitHub Actions secrets for updatable future releases." > dist/SIGNING_INFO.txt
          fi
          SDK_BIN="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "${UNSIGNED}"
          "${SDK_BIN}/zipalign" -f -p 4 "${UNSIGNED}" "${RUNNER_TEMP}/githubble-aligned.apk"
          "${SDK_BIN}/apksigner" sign \
            --ks "${RUNNER_TEMP}/githubble-release.p12" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out dist/GitHubble-1.0.0-RC3.8.1-release.apk \
            "${RUNNER_TEMP}/githubble-aligned.apk"
          "${SDK_BIN}/apksigner" verify --verbose --print-certs dist/GitHubble-1.0.0-RC3.8.1-release.apk > dist/APK_VERIFICATION.txt
          "${SDK_BIN}/aapt" dump badging dist/GitHubble-1.0.0-RC3.8.1-release.apk | grep '^package:' > dist/PACKAGE_INFO.txt
          grep -q "name='app.githubble.mobile'" dist/PACKAGE_INFO.txt
          grep -q "versionCode='43'" dist/PACKAGE_INFO.txt
          sha256sum dist/GitHubble-1.0.0-RC3.8.1-release.apk > dist/SHA256SUMS.txt
          rm -f "${RUNNER_TEMP}/githubble-release.p12" "${RUNNER_TEMP}/githubble-aligned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: githubble-rc3.8.1-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
