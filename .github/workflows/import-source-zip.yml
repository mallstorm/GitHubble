name: Import reviewed GitHubble source tree

on:
  push:
    branches: [main]
    paths:
      - 'GitHubble_RC4_IMPORT.zip'
      - 'GitHubble_RC4_IMPORT.sha256'

permissions:
  contents: write

concurrency:
  group: githubble-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='GitHubble_RC4_IMPORT.zip'
          CHECKSUM='GitHubble_RC4_IMPORT.sha256'
          if [[ ! -f "$ARCHIVE" || ! -f "$CHECKSUM" ]]; then
            echo 'Import payload already consumed; nothing to do.'
            exit 0
          fi
          sha256sum --check "$CHECKSUM"
          WORK="$(mktemp -d)"
          unzip -q "$ARCHIVE" -d "$WORK/source"
          test -f "$WORK/source/settings.gradle"
          test -f "$WORK/source/version.properties"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/import-source-zip.yml' \
            --exclude="$ARCHIVE" \
            --exclude="$CHECKSUM" \
            "$WORK/source/" ./
          rm -f "$ARCHIVE" "$CHECKSUM"
          git config user.name 'mallstorm'
          git config user.email '142712475+mallstorm@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'GitHubble RC4.0: roadmap modernization and hardening'
          git push origin HEAD:main
